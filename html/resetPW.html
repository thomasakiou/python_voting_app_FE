<header class="header-bar">
    <div class="header-content">
        <h1 class="logo"></h1>
        <button id="menuToggle" class="menu-toggle" aria-expanded="false" aria-label="Toggle menu">☰</button>
        <div class="btns">
            <a href="admin.html" class="btn header-btn">Home</a>
            <a href="user.html" class="btn header-btn">Users</a>
            <a href="candidates.html" class="btn header-btn">Candidates</a>

    </div>
</header>


<div class="votes-list">
    <div class="container mt-5">
        <h2>Reset User Password</h2>
        <p class="text-muted">Only admins or super-admins can reset passwords.</p>

        <div class="mb-3">
            <label for="usernameInput" class="form-label">Username</label>
            <input type="text" class="form-control" id="usernameInput" placeholder="Enter username">
        </div>

        <button id="resetBtn" class="btn btn-warning mt-3">Reset Password</button>

        <div id="message" class="mt-3"></div>
    </div>
</div>

<script type="module" src="../js/resetPW.js"></script>
<script src="../js/logout.js"></script>

</html>

<script>
    (function(){
        const toggle = document.getElementById('menuToggle');
        const menu = document.querySelector('.btns');
        if (!toggle || !menu) return;
        toggle.addEventListener('click', function(){
            menu.classList.toggle('open');
            const expanded = this.getAttribute('aria-expanded') === 'true';
            this.setAttribute('aria-expanded', (!expanded).toString());
        });
    })();
</script>
