<header class="header-bar">
    <div class="header-content no-hamburger">
        <h1 class="logo">Voting System</h1>
        <div class="btns">
            <button id="logoutBtn" onclick="logout()">Logout</button>
        </div>
    </div>
</header>



<div class="vote-container">
    <h2>Cast Your Vote</h2>
    <form id="voteForm">
        <div class="input-group">
            <label for="office_code">Select Office</label>
            <select id="office_code" name="office_code" required>
                <option value="">-- Select Office --</option>
            </select>
        </div>
        <div class="input-group">
            <label for="candidate_code">Select Candidate</label>
            <select id="candidate_code" name="candidate_code" required>
                <option value="">-- Select Candidate --</option>
            </select>
        </div>
        <button type="submit">Submit Vote</button>
    </form>
    <p id="voteMessage"></p>
</div>

<!-- Small script to toggle the header menu on mobile -->
<script>
    (function(){
        // keep script present but safely no-op for vote page (no menuToggle)
        const toggle = document.getElementById('menuToggle');
        const menu = document.querySelector('.btns');
        if (!toggle || !menu) return;
        toggle.addEventListener('click', function(){
            menu.classList.toggle('open');
            const expanded = this.getAttribute('aria-expanded') === 'true';
            this.setAttribute('aria-expanded', (!expanded).toString());
        });
    })();
</script>
</body>
