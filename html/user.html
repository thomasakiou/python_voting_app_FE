<script>
    // Initialize DataTable with pagination
    document.addEventListener('DOMContentLoaded', function() {
        $('#usersTable').DataTable({
            "pageLength": 10,  // Show 10 entries per page
            "lengthMenu": [10, 25, 50, 100],  // Dropdown options for entries per page
            "order": [[0, 'asc']],  // Default sort by first column (Username)
            "dom": 'Bfrtip',  // Add buttons to the DOM
            "buttons": [
                'pageLength',  // Show entries per page dropdown
                'copy', 'csv', 'excel', 'pdf', 'print'  // Common export options
            ]
        });
    });
</script>

<script>
    (function(){
        const toggle = document.getElementById('menuToggle');
        const menu = document.querySelector('.btns');
        if (!toggle || !menu) return;
        toggle.addEventListener('click', function(){
            menu.classList.toggle('open');
            const expanded = this.getAttribute('aria-expanded') === 'true';
            this.setAttribute('aria-expanded', (!expanded).toString());
        });
    })();
</script>
