<header class="header-bar">
    <div class="header-content">
        <h1 class="logo"></h1>
        <button id="menuToggle" class="menu-toggle" aria-expanded="false" aria-label="Toggle menu">☰</button>
        <div class="btns">
            <a href="user.html" class="btn header-btn">Users</a>
            <a href="candidates.html" class="btn header-btn">Candidates</a>
            <a href="offices.html" class="btn header-btn">Offices</a>
            <a href="results.html" class="btn header-btn">Results</a>
<!--            <a href="changePW.html" class="btn header-btn">Change Password</a>-->
<!--            <a href="resetPW.html" class="btn header-btn">Reset Password</a>-->
            <button id="logoutBtn" onclick="logout()">Logout</button>
        </div>
    </div>
</header>


<div class="votes-list">
    <h2>All Votes</h2>
    <div class="all-users">
        <button id="loadVotes" class="mt-1">Load Votes</button>
        <button id="exportPDF" class="mt-1"><span class="btn-icon">📄</span> Export Votes to PDF</button>
    </div>

    <!-- Search input -->
    <div class="mb-3">
        <div class="input-group">
            <span class="input-group-text">Search:</span>
            <input type="text" id="votesSearch" class="form-control" placeholder="Search votes...">
        </div>
    </div>

    <!-- Votes table -->
    <div class="table-responsive">
        <table id="votesTable" class="table table-striped">
            <thead class="table-dark">
                <tr>
                    <th style="width: 5%;">#</th>
                    <th style="width: 25%;">Voter</th>
                    <th style="width: 30%;">Candidate</th>
                    <th style="width: 30%;">Office Voted For</th>
                    <th style="width: 10%;">Date</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <!-- Pagination info and controls -->
    <div class="pagination-container mt-3 d-flex justify-content-between align-items-center">
        <div class="entries-info"></div>
        <ul class="pagination mb-0"></ul>
    </div>
</div>

<script type="module" src="../js/admin.js"></script>
<script src="../js/logout.js"></script>

</html>

<script>
    (function(){
        const toggle = document.getElementById('menuToggle');
        const menu = document.querySelector('.btns');
        if (!toggle || !menu) return;
        toggle.addEventListener('click', function(){
            menu.classList.toggle('open');
            const expanded = this.getAttribute('aria-expanded') === 'true';
            this.setAttribute('aria-expanded', (!expanded).toString());
        });
    })();
</script>
